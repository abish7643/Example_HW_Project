name: Firmware Release

on:
  push:
    branches:
      - Firmware_Releases
    paths:
      - "Firmware/Firmware_PIOTemplate/**"
      - "!Firmware/Firmware_PIOTemplate/**/*.md"
  workflow_dispatch:

concurrency:
  group: firmware-release
  cancel-in-progress: false

env:
  PROJECT_DIR: Firmware/Firmware_PIOTemplate
  RELEASE_ENVS: HWExample_RevA HWExample_RevB

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            Firmware/Firmware_PIOTemplate/.pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('Firmware/Firmware_PIOTemplate/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build firmware
        working-directory: ${{ env.PROJECT_DIR }}
        run: pio run $(printf -- '-e %s ' $RELEASE_ENVS)

      - name: Package firmware
        id: package
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash scripts/package_release.sh $RELEASE_ENVS

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Firmware_PIOTemplate_${{ steps.package.outputs.VERSION }}+${{ steps.package.outputs.HASH }}
          path: ${{ env.PROJECT_DIR }}/release/*.zip
          if-no-files-found: error
          retention-days: 365

      - name: Check release tag
        env:
          TAG: ${{ steps.package.outputs.TAG }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Release $TAG Already Exists, Bump FIRMWARE_VERSION In include/firmware.h"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.TAG }}
          name: PIOTemplate Firmware ${{ steps.package.outputs.VERSION }}
          body_path: ${{ env.PROJECT_DIR }}/release/release_notes.md
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.package.outputs.PRERELEASE == 'true' }}
          files: ${{ env.PROJECT_DIR }}/release/*.zip
          fail_on_unmatched_files: true
